plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.maestro.animationtest'
    compileSdk 36

    defaultConfig {
        applicationId "dev.maestro.animationtest"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
}
